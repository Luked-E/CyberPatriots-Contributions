<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberPatriots Contributions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
    Dark mode: Off
  </button>
  <div id="app"></div>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme');

    if (savedTheme === 'dark') {
      document.documentElement.dataset.theme = 'dark';
    }

    function updateThemeToggle() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      themeToggle.textContent = `Dark mode: ${isDark ? 'On' : 'Off'}`;
      themeToggle.setAttribute('aria-pressed', String(isDark));
    }

    updateThemeToggle();
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeToggle();
    });
  </script>
  <script>
    let sidebarSectionId = 0;

    function addSidebarDisclosure(item, nestedList, label, inline) {
      if (nestedList.dataset.disclosureReady) {
        return;
      }

      const sectionName = label.textContent.trim();
      const sectionKey = `sidebar-section:${label.tagName === 'A' ? label.href : sectionName}`;
      const button = document.createElement('button');
      const listId = `sidebar-section-${sidebarSectionId++}`;
      const isExpanded = localStorage.getItem(sectionKey) !== 'collapsed';

      nestedList.id = listId;
      nestedList.dataset.disclosureReady = 'true';
      item.classList.add('nav-collapsible');
      item.classList.toggle('nav-collapsed', !isExpanded);
      nestedList.hidden = !isExpanded;
      button.className = 'sidebar-disclosure';
      button.type = 'button';
      button.setAttribute('aria-controls', listId);
      button.setAttribute('aria-expanded', String(isExpanded));
      button.setAttribute(
        'aria-label',
        `${isExpanded ? 'Collapse' : 'Expand'} ${sectionName}`
      );

      button.addEventListener('click', () => {
        const isExpanded = button.getAttribute('aria-expanded') === 'true';
        const nextExpanded = !isExpanded;
        button.setAttribute('aria-expanded', String(!isExpanded));
        button.setAttribute(
          'aria-label',
          `${isExpanded ? 'Expand' : 'Collapse'} ${sectionName}`
        );
        item.classList.toggle('nav-collapsed', isExpanded);
        nestedList.hidden = isExpanded;
        localStorage.setItem(sectionKey, nextExpanded ? 'expanded' : 'collapsed');
      });

      if (inline) {
        item.classList.add('nav-disclosure-inline');
        item.append(button);
      } else {
        label.append(button);
      }
    }

    function addSidebarDisclosures() {
      document.querySelectorAll('.sidebar-nav li').forEach((item) => {
        const nestedList = Array.from(item.children).find((child) => child.tagName === 'UL');
        if (!nestedList) {
          return;
        }

        const label = Array.from(item.children).find((child) =>
          child.matches('p, a')
        );
        if (!label) {
          return;
        }

        addSidebarDisclosure(item, nestedList, label, label.tagName === 'A');
      });

      document.querySelectorAll('.sidebar-nav ul.app-sub-sidebar').forEach((nestedList) => {
        const item = nestedList.previousElementSibling;
        const label = item && Array.from(item.children).find((child) => child.tagName === 'A');
        if (item?.tagName === 'LI' && label) {
          addSidebarDisclosure(item, nestedList, label, true);
        }
      });
    }

    const sidebarObserver = new MutationObserver(addSidebarDisclosures);
    sidebarObserver.observe(document.body, {
      childList: true,
      subtree: true
    });
    addSidebarDisclosures();

    document.addEventListener('click', (event) => {
      const link = event.target.closest('.sidebar-nav a[href*="?id="]');
      if (!link) {
        return;
      }

      const headingId = new URLSearchParams(link.hash.split('?')[1]).get('id');
      if (!headingId) {
        return;
      }

      window.setTimeout(() => {
        const heading = document.getElementById(headingId);
        const content = document.querySelector('.content');
        if (!heading || !content) {
          return;
        }

        const scrollTop =
          content.scrollTop +
          heading.getBoundingClientRect().top -
          content.getBoundingClientRect().top;
        content.scrollTo({ top: scrollTop, behavior: 'smooth' });
      }, 100);
    });
  </script>
  <script>
    window.$docsify = {
      name: 'CyberPatriots Guides',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        paths: 'auto',
        namespace: 'exclude-h2-sections-v1'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script>
    function omitH2Sections(markdown) {
      let ignored = false;
      let fenceChar = '';
      let fenceLength = 0;

      return markdown.split('\n').filter((line) => {
        const fence = line.match(/^\s*(`{3,}|~{3,})/);
        if (fence) {
          if (!fenceChar) {
            fenceChar = fence[1][0];
            fenceLength = fence[1].length;
          } else if (fence[1][0] === fenceChar && fence[1].length >= fenceLength) {
            fenceChar = '';
            fenceLength = 0;
          }
          return !ignored;
        }

        if (fenceChar) {
          return !ignored;
        }

        const heading = line.match(/^ {0,3}(#{1,6})(?:[ \t]+|$)/);
        if (heading && heading[1].length <= 2) {
          ignored = heading[1].length === 2;
        }

        return !ignored;
      }).join('\n');
    }

    const docsifyGet = window.Docsify.get;
    window.Docsify.get = function (url, cache, ...args) {
      const request = docsifyGet.call(this, url, cache, ...args);
      if (
        cache !== false ||
        /(?:^|\/)_(?:sidebar|navbar|coverpage)(?:\.[^/?#]+)?(?:[?#]|$)/i.test(url)
      ) {
        return request;
      }

      return new Promise((resolve, reject) => {
        request.then((content) => {
          resolve(typeof content === 'string' ? omitH2Sections(content) : content);
        }, reject);
      });
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
